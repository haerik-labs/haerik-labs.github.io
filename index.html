<style>
*{box-sizing:border-box}
body{margin:0;background:#FDF7F6;color:#434242;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;line-height:1.7;word-break:keep-all;-webkit-text-size-adjust:100%}
main{max-width:560px;margin:0 auto;padding:40px 20px 56px}
.card{background:#FEFEFE;border-radius:20px;padding:28px 22px;box-shadow:0 2px 12px rgba(248,113,129,.12)}
.center{text-align:center}
.logo{width:88px;height:88px;border-radius:22px;display:block;margin:0 auto 20px}
h1{margin:0 0 12px;font-size:22px;line-height:1.4;color:#0B0B0C}
h2{margin:28px 0 8px;font-size:16px;color:#0B0B0C}
p{margin:0 0 10px;font-size:15px}
p.sub{margin-top:18px;font-weight:700;color:#0B0B0C}
p.muted,.muted{color:#8D898B;font-size:13px}
a{color:#F35F79}
.btn{display:block;width:100%;margin:20px 0 0;padding:15px 16px;border-radius:14px;background:#F87181;color:#fff;font-size:16px;font-weight:700;text-align:center;text-decoration:none}
.btn:active{background:#F35F79}
.btn.ghost{background:#FDF3F2;color:#F35F79}
.divider{margin:28px 0 0;padding-top:20px;border-top:1px solid #FDF3F2}
nav.links{margin-top:20px;display:flex;flex-wrap:wrap;gap:6px 16px;justify-content:center;font-size:13px}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<div class="card center">
<img class="logo" src="/fillog/assets/app_icon.png" alt="FILLOG">
